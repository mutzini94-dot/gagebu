<title>고정비 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 통장 정리표: 크롬은 무채색, 색(--hue)은 '아직 안 나간 돈' 한 가지에만.
   셸: 240px 사이드바(바탕과 같은 색) + 유동 캔버스(좌우 32px).
   1440에서 1440 - 240 - 32*2 = 1136 = 1fr(374.7) + 12 + 2fr(749.3).
   숫자·라틴은 Geist, 한글은 IBM Plex Sans KR(Geist에 한글이 없어 자동으로 넘어감). */
:root{
  --ground:#f2f4f7; --surface:#ffffff; --raised:#eef0f3; --active:#e3e6eb;
  --border:#e3e6ea; --rule:#eef0f2; --control:#cfd3d9;
  --text:#0a0a0a; --muted:#5d636b; --faint:#6b7079;
  --primary:#141414; --primary-ink:#ffffff; --primary-hover:#2e2e2e;
  --hue:#1d5fbf; --done:#c4c9d0; --thin:#d5d9de;
  --negative:#c4242a; --warn-bg:#fffbeb; --warn-ink:#92400e; --tag-bg:#eef0f3; --tag-ink:#3d3d3d;
  --grid:#e7e9ec;
  --radius-card:8px; --radius-control:6px; --radius-chip:4px;
  --gap:12px; --card-pad:20px; --pad:32px; --control-h:36px;
  --font:"Geist","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs-title:24px; --fs-section:16px; --fs-kpi:30px; --fs-body:14px; --fs-small:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#000000; --surface:#111111; --raised:#1c1c1c; --active:#242424;
    --border:#262626; --rule:#1d1d1d; --control:#454545;
    --text:#ffffff; --muted:#b4b4b4; --faint:#949494;
    --primary:#ffffff; --primary-ink:#000000; --primary-hover:#e2e2e2;
    --hue:#6b9ef0; --done:#4a4a4a; --thin:#3a3a3a;
    --negative:#ef6b7f; --warn-bg:#2a2112; --warn-ink:#f2c46d; --tag-bg:#222222; --tag-ink:#d0d0d0;
    --grid:#262626; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#000000; --surface:#111111; --raised:#1c1c1c; --active:#242424;
  --border:#262626; --rule:#1d1d1d; --control:#454545;
  --text:#ffffff; --muted:#b4b4b4; --faint:#949494;
  --primary:#ffffff; --primary-ink:#000000; --primary-hover:#e2e2e2;
  --hue:#6b9ef0; --done:#4a4a4a; --thin:#3a3a3a;
  --negative:#ef6b7f; --warn-bg:#2a2112; --warn-ink:#f2c46d; --tag-bg:#222222; --tag-ink:#d0d0d0;
  --grid:#262626; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden],.ov[hidden],.toast[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:20px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd{margin:0}
h1,h2,h3{font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.num,.money input{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:28px;padding:30px 12px 20px;border-right:1px solid var(--border);
  padding-left:max(12px, env(safe-area-inset-left, 0px))}
.mark{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:16px;font-weight:500;line-height:24px}
.mark svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:var(--radius-control);background:none;color:var(--muted);text-align:left}
.nav button svg{flex:none}
.nav button:hover:not(:disabled){background:var(--raised);color:var(--text)}
.nav button[aria-current="page"]{background:var(--active);color:var(--text)}
.nav button:disabled{cursor:not-allowed;color:var(--faint)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.side-foot{margin-top:auto;padding:0 10px}
.status{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:16px;color:var(--muted)}
.status em{font-style:normal}
.status i{flex:none;width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--faint)}
.status[data-s="ok"] i{background:#2e7d32} .status[data-s="err"] i{background:var(--negative)}
.canvas{min-width:0;padding:32px var(--pad) 56px;padding-right:max(var(--pad), env(safe-area-inset-right, 0px))}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}

/* title row */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:24px}
.head-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.head h1{font-size:var(--fs-title);line-height:32px;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:14px;line-height:20px;max-width:84ch;text-wrap:pretty}
.head .sub .warn{color:var(--negative);font-weight:500}
.head-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthnav{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mlabel{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0 8px;margin-left:-8px;border-radius:var(--radius-control);font-size:inherit;line-height:inherit;font-weight:inherit;letter-spacing:inherit}
.mlabel:hover,.mlabel[aria-expanded="true"]{background:var(--raised)}
.mlabel svg{color:var(--muted)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);color:var(--text)}
.iconbtn:hover{background:var(--raised)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h);padding:0 14px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--negative);border-color:currentColor}
.btn.danger.armed{background:var(--negative);border-color:var(--negative);color:#fff}
.link{border:0;background:none;padding:2px 0;font-size:14px;font-weight:500;color:var(--text);text-decoration:underline;text-decoration-color:var(--control);text-underline-offset:4px}
.link:hover{text-decoration-color:currentColor}
.edit{border:0;background:none;height:32px;padding:0 6px;border-radius:var(--radius-control);color:var(--muted);font-size:13px}
.edit:hover{color:var(--text);background:var(--raised)}
.txt{width:100%;min-width:0;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface)}
.txt:focus{outline:0;border-color:var(--text)}
select.txt{appearance:auto}
.money{display:flex;align-items:center;gap:4px;height:var(--control-h);min-width:0;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface)}
.money:focus-within{border-color:var(--text)}
.money input{width:100%;min-width:0;border:0;outline:0;background:transparent;text-align:right;font-size:14px}
.money span{color:var(--muted);font-size:13px}
.check{display:grid;place-items:center;width:44px;height:44px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:20px;height:20px;margin:0;border:1.5px solid var(--control);border-radius:var(--radius-chip);background:var(--surface);cursor:pointer}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--primary-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.tag{flex:none;display:inline-block;margin-left:6px;padding:0 6px;border-radius:var(--radius-chip);background:var(--tag-bg);color:var(--tag-ink);font-size:11px;line-height:18px;font-weight:500;white-space:nowrap;vertical-align:1px}
.tag.warn{margin-left:0;background:var(--warn-bg);color:var(--warn-ink)}

/* cards */
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:var(--gap);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.pin{position:sticky;top:32px}
.card{min-width:0;padding:var(--card-pad);border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;min-height:24px;margin-bottom:16px}
.card-h h2{font-size:var(--fs-section);line-height:24px}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:14px}

/* lead: 남은 이체 */
.kpi-l{font-size:14px;line-height:20px;color:var(--muted);font-weight:400}
.kpi{margin-top:4px;font-size:var(--fs-kpi);line-height:36px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.kpi small{margin-left:2px;font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi-s{margin-top:4px;color:var(--muted)}
.plan{display:flex;gap:2px;height:8px;margin-top:20px;border-radius:999px;overflow:hidden;background:var(--raised)}
.plan span{display:block;height:100%}
.plan .p-done{background:var(--done)} .plan .p-left{background:var(--hue)}
.plan-l{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.plan-l b{font-weight:500;color:var(--text)}
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h3{font-size:14px;line-height:20px}
.sec-h span{font-size:13px;color:var(--muted)}
.acct{padding:10px 0;border-top:1px solid var(--rule)}
.acct .r1,.acct .r2,.cat-r .r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.acct .nm{border:0;background:none;padding:0;text-align:left;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .nm:hover{text-decoration:underline;text-underline-offset:3px}
.acct .r1 .num{font-weight:500;white-space:nowrap}
.acct .r1 .num.zero{color:var(--muted);font-weight:400}
.acct .r2{margin-top:2px;font-size:13px;color:var(--muted)}
.acct .r2 span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .r3{margin-top:6px;font-size:13px;color:var(--muted)}
.acct .r3 b{font-weight:500;color:var(--text)}
.cat-r{padding:6px 0 8px}
.cat-r .r1 em{font-style:normal;font-size:13px;color:var(--muted);margin-left:4px}
.cat-r .r1 .num.zero{color:var(--muted)}
.cat-r .thin{display:block;height:2px;margin-top:6px;background:var(--thin)}
.cat-r.top .thin{background:var(--text)}

/* 이체 달력 */
.dchart{display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:160px 24px}
.dc-y{position:relative;font-size:11px;color:var(--muted)}
.dc-y span{position:absolute;right:10px;transform:translateY(50%);line-height:12px;white-space:nowrap}
.dc-plot{position:relative;border-bottom:1px solid var(--text)}
.dc-grid{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.dc-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr))}
.dc-col{display:flex;flex-direction:column-reverse;gap:2px;padding:0 22%;min-width:0}
.dc-col span{display:block;min-height:2px;background:var(--hue)}
.dc-col span.done{background:var(--done)}
.dc-today{position:absolute;top:-4px;bottom:0;width:1px;background:var(--text)}
.dc-today em{position:absolute;top:-16px;left:4px;font-style:normal;font-size:11px;line-height:12px;color:var(--text);white-space:nowrap}
.dc-x{grid-column:2;position:relative;font-size:11px;color:var(--muted)}
.dc-x span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:8px;height:8px;background:var(--hue)}
.sw.done{background:var(--done)}

/* 이체 목록 */
.t-head,.row,.t-foot{display:grid;grid-template-columns:52px minmax(0,1fr) 152px 44px 48px;gap:0 12px;align-items:center}
.t-head{height:32px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.t-head .r,.t-foot .r{text-align:right}
.t-head .c{text-align:center}
.row{min-height:60px;padding:8px 0;border-bottom:1px solid var(--rule)}
.d{display:flex;flex-direction:column;line-height:18px}
.d b{font-size:16px;font-weight:500}
.d small{font-size:13px;color:var(--muted)}
.d small.late{color:var(--negative);font-weight:500}
.n{min-width:0}
.nm{font-weight:500;overflow-wrap:anywhere}
.mt{margin-top:2px;font-size:13px;line-height:18px;color:var(--muted);overflow-wrap:anywhere}
.row.paid .nm{color:var(--muted)}
.row.paid .money input{color:var(--muted)}
.t-foot{min-height:48px;padding-top:4px}
.t-foot span:first-child{grid-column:1 / 3;color:var(--muted)}
.t-foot b{font-weight:700;text-align:right;padding-right:31px}
.t-more{margin-top:8px}

/* 고정비 등록 (설정) */
.notice{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:24px;padding:10px 14px;border:1px solid #fde68a;border-radius:var(--radius-card);background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
.notice .link{color:var(--warn-ink);font-size:13px}
.sect{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:var(--gap);padding:32px 0;border-top:1px solid var(--border)}
.sect:first-of-type{border-top:0;padding-top:0}
.sect-l{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:8px 32px 0 0}
.sect-l h2{font-size:var(--fs-section);line-height:24px}
.sect-l p{color:var(--muted);max-width:44ch}
.kv{align-self:stretch;margin-top:8px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--rule)}
.kv dt{color:var(--muted)}
.kv dd{white-space:nowrap}
.kv .total{border-top-color:var(--border)}
.kv .total dt{color:var(--text)}
.kv .total dd{font-weight:700}
.grp+.grp{margin-top:24px}
.grp-h{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.grp-h h3{font-size:14px}
.grp-h .cnt{font-size:12px;color:var(--muted)}
.grp-h .link{margin-left:auto;font-size:13px}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) 128px 48px;gap:0 12px;align-items:center;min-height:56px;padding:6px 0;border-bottom:1px solid var(--rule)}
.srow .a{text-align:right;white-space:nowrap}
.srow .dash{color:var(--muted)}
.srow.acc{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 48px}
.none{padding:14px 0;color:var(--muted);border-bottom:1px solid var(--rule)}
.first{max-width:760px;display:flex;flex-direction:column;gap:12px}
.first h2{font-size:var(--fs-section);line-height:24px}
.first p{color:var(--muted);max-width:60ch}
.first .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sect-end{display:flex;justify-content:flex-end;padding-top:8px}

/* 요약 공유 */
.sharebox{height:auto;min-height:280px;padding:16px;border:1px solid var(--border);background:var(--ground);line-height:24px;font-size:14px;resize:vertical;white-space:pre-wrap;overflow:auto}

/* month picker (떠 있는 것만 그림자) */
.picker{position:absolute;top:calc(100% + 8px);left:0;z-index:15;width:min(320px, calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.14);font-size:14px;line-height:20px;letter-spacing:0;font-weight:400}
.pk-h{display:flex;align-items:center;justify-content:space-between}
.pk-h b{font-size:16px;font-weight:500}
.pk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pk-m{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;padding:8px 2px 6px;border:1px solid transparent;border-radius:var(--radius-control);background:none}
.pk-m b{font-size:14px;font-weight:500}
.pk-m small{min-height:16px;font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk-m.has small{color:var(--text)}
.pk-m.today{border-color:var(--control)}
.pk-m.on{background:var(--active)}
.pk-m:hover:not(.on){background:var(--raised)}
.pk-p{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px;line-height:12px;color:var(--muted)}
.pk-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}

/* modal (떠 있는 것만 그림자) */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.36);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal{width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);box-shadow:0 20px 48px rgba(0,0,0,.22)}
.modal h2{font-size:18px;line-height:24px}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:14px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;height:32px;padding:0 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);font-size:14px;line-height:30px;cursor:pointer}
.seg input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.seg input:focus-visible + span{outline:2px solid var(--text);outline-offset:2px}
.mfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.err{min-height:1em;font-size:13px;color:var(--negative)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:30;max-width:calc(100% - 32px);transform:translateX(-50%);padding:10px 16px;border-radius:var(--radius-card);background:var(--primary);color:var(--primary-ink);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.gate{width:min(340px, calc(100% - 32px));margin:14vh auto 0;display:flex;flex-direction:column;gap:12px;padding:28px 24px;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);text-align:center}
.gate h1{font-size:20px;line-height:28px}
.gate .mark{justify-content:center;padding:0}
.gate input{height:44px;text-align:center;font-size:20px;letter-spacing:.3em}
.gate .btn{height:44px}
.kw{position:fixed;z-index:40;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;padding:4px 9px;border-radius:var(--radius-control);background:var(--primary);color:var(--primary-ink);font-size:12px;font-weight:500}

/* tablet: 사이드바를 위 막대로, 화면 이동은 아래 막대로 */
@media (max-width: 1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:12;height:auto;flex-direction:row;align-items:center;gap:12px;padding:0 20px;min-height:52px;border-right:0;border-bottom:1px solid var(--border);background:var(--ground);
    padding-top:env(safe-area-inset-top, 0px)}
  .mark{padding:0}
  .side-foot{margin:0 0 0 auto;padding:0;min-width:0}

<div id="app"><div class="loading">가계부를 불러오는 중…</div></div>
<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="kw" id="kw" hidden aria-live="polite"></div>

<script>
(function(){
const CATS=[
  {k:'card', n:'카드값', ph:'예: 신한카드'},
  {k:'loan', n:'대출',   ph:'예: 전세자금대출'},
  {k:'ins',  n:'보험',   ph:'예: 실손보험'},
  {k:'allow',n:'용돈',   ph:'예: 배우자 용돈'},
  {k:'save', n:'저축',   ph:'예: 주택청약'}
];
const CATN=Object.fromEntries(CATS.map(c=>[c.k,c.n]));
const WD='일월화수목금토';
const won=n=>(Math.round(Number(n)||0)).toLocaleString('ko-KR');
const num=s=>{const v=String(s??'').replace(/[^\d]/g,'');return v?Number(v.slice(0,13)):0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));

const app=document.getElementById('app'), ov=document.getElementById('ov'), toastEl=document.getElementById('toast');

/* ---------- state ---------- */
const now=new Date();
let cur={y:now.getFullYear(), m:now.getMonth()+1};
let settings={accounts:[],fixed:[]};
let settingsLoaded=false;
const months={};               // key -> doc | null (null = 기록 없음), absent = 아직 불러오는 중
let mode='init', db=null, uidv=null;
let statusS='', statusT='';

const mkey=(c)=>`m-${c.y}-${String(c.m).padStart(2,'0')}`;
const shift=(c,d)=>{let y=c.y,m=c.m+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return{y,m}};
const lastDay=(c)=>new Date(c.y,c.m,0).getDate();
const dayOf=(f,c)=>{const ld=lastDay(c);const d=Number(f.day)||0;return (d===0||d>ld)?ld:d};
const wdOf=(c,d)=>new Date(c.y,c.m-1,d).getDay();
function normSettings(s){s=s||{};return{accounts:Array.isArray(s.accounts)?s.accounts:[],fixed:Array.isArray(s.fixed)?s.fixed:[]}}
function ensure(k){
  if(!months[k]) months[k]={paid:{},amounts:{}};
  const m=months[k]; m.paid=m.paid||{}; m.amounts=m.amounts||{};
  return m;
}
const view=(m)=>m||{paid:{},amounts:{}};
const amountOf=(f,m)=>{const o=m.amounts&&m.amounts[f.id];return (typeof o==='number')?o:(Number(f.amount)||0)};

/* ---------- storage: db(내 계정, 비공개) 또는 이 브라우저 ---------- */
const LS='household-ledger-v1:';
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));return true}catch(e){return false}}
// 기기 내부 DB(IndexedDB). localStorage에도 같이 적어 둔다
const IDB={
  open(){
    if(this.p) return this.p;
    this.p=new Promise(res=>{
      const t=setTimeout(()=>res(null),3000);
      try{
        const r=indexedDB.open('household-ledger',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>{clearTimeout(t);res(r.result)};
        r.onerror=r.onblocked=()=>{clearTimeout(t);res(null)};
      }catch(e){clearTimeout(t);res(null)}
    });
    return this.p;
  },
  async req(mode,fn){
    const d=await this.open(); if(!d) throw new Error('no idb');
    return new Promise((res,rej)=>{const tx=d.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=tx.onabort=()=>rej(tx.error)});
  },
  async get(k){ try{const v=await this.req('readonly',st=>st.get(k)); if(v!==undefined&&v!==null) return v}catch(e){} return lsGet(k) },
  async set(k,v){ const a=lsSet(k,v); let b=false; try{await this.req('readwrite',st=>st.put(v,k)); b=true}catch(e){} return a||b },
  async keys(){
    let ks=[]; try{ks=await this.req('readonly',st=>st.getAllKeys())||[]}catch(e){}
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith(LS)) ks.push(k.slice(LS.length))}}catch(e){}
    return [...new Set(ks.map(String))];
  }
};
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
const docPath=k=>`data/users/${uidv}/${k}`;

/* ---------- Supabase 서버 DB (claude.ai 밖, 예: GitHub Pages에서 사용) ---------- */
const SB_URL='https://ttwkyqqvudbjmlqykcyt.supabase.co';
const SB_KEY='sb_publishable_0dW0OFqfY5owFvXOYFRqsw_z_WNZl8d';   // 공개용(publishable) 키
let sbFailed=false;
function sbPass(){try{return sessionStorage.getItem(LS+'pw')||''}catch(e){return ''}}
async function sbRpc(fn,body){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    const j=await r.json().catch(()=>null);
    if(!r.ok){const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}
    return j;
  }finally{clearTimeout(t)}
}
// 아직 서버에 못 보낸 문서 목록 (새로고침해도 남도록 기기에 보관)
const sbDirty=new Set((()=>{try{return JSON.parse(localStorage.getItem(LS+'sb-pending')||'[]')}catch(e){return []}})());
function saveDirty(){try{localStorage.setItem(LS+'sb-pending',JSON.stringify([...sbDirty]))}catch(e){}}
const docOf=k=>clone(k==='settings'?settings:(months[k]||{}));
function sbFlush(){
  [...sbDirty].forEach(k=>{
    chains[k]=(chains[k]||Promise.resolve()).then(()=>sbDirty.has(k)?sbRpc('ledger_put',{p_pass:sbPass(),p_key:k,p_data:docOf(k)}):null)
      .then(()=>{ sbDirty.delete(k); saveDirty(); if(!Object.keys(timers).length&&!sbDirty.size) setStatus('ok') })
      .catch(e=>{ setStatus('err'); toast(e.status===403?'서버 비밀번호가 맞지 않아 저장하지 못했어요.':'서버에 저장하지 못했어요. 이 기기에는 저장돼 있고, 연결되면 다시 보낼게요.') });
  });
}
async function sbBoot(){
  try{
    const rows=await sbRpc('ledger_get',{p_pass:sbPass()});
    const remote={}; (rows||[]).forEach(r=>{remote[r.key]=r.data});
    mode='sb'; sbFailed=false;
    const rs=normSettings(remote.settings);
    if(!rs.fixed.length&&!rs.accounts.length){
      // 서버가 비어 있으면 이 기기에 있던 데이터를 올린다
      const loc=normSettings(await IDB.get('settings'));
      if(loc.fixed.length||loc.accounts.length){
        settings=loc; sbDirty.add('settings');
        for(const k of (await IDB.keys()).filter(isMonthKey)){ const v=await IDB.get(k); if(v){ months[k]=v; sbDirty.add(k) } }
        saveDirty(); sbFlush(); toast('이 기기에 있던 데이터를 서버에 저장했어요');
      }
    }else{
      settings=normSettings(remote.settings);
      Object.keys(remote).filter(isMonthKey).forEach(k=>{ months[k]=remote[k] });
      Object.entries(remote).forEach(([k,v])=>{ if(!sbDirty.has(k)) IDB.set(k,v) });   // 서버 내용을 기기에 백업
      // 연결이 끊긴 동안 기기에서 바꾼 문서는 기기 쪽을 올린다
      for(const k of [...sbDirty]){ const v=await IDB.get(k); if(v){ if(k==='settings') settings=normSettings(v); else months[k]=v } else sbDirty.delete(k) }
      saveDirty(); if(sbDirty.size) sbFlush();
    }
    settingsLoaded=true; setStatus('ok');
  }catch(e){
    sbFailed=true;
    if(e&&e.status===403) toast('서버 비밀번호가 맞지 않아요. 이 기기에만 저장합니다.');
  }
}
// 다른 기기에서 바꾼 내용을 화면으로 돌아올 때 다시 불러온다
async function sbRefresh(){
  if(mode!=='sb'||Object.keys(timers).length||sbDirty.size||modal) return;
  try{
    const rows=await sbRpc('ledger_get',{p_pass:sbPass()});
    if(Object.keys(timers).length||sbDirty.size) return;
    let changed=false;
    (rows||[]).forEach(r=>{
      if(r.key==='settings'){ const d=normSettings(r.data); if(JSON.stringify(d)!==JSON.stringify(settings)){settings=d;changed=true} }
      else if(isMonthKey(r.key) && JSON.stringify(months[r.key])!==JSON.stringify(r.data)){ months[r.key]=r.data; changed=true }
      IDB.set(r.key,r.data);
    });
    if(changed) render();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sbRefresh() });
window.addEventListener('online',()=>{ if(mode==='sb'&&sbDirty.size) sbFlush() });
const timers={}, chains={};
function persist(k,delay=450){
  clearTimeout(timers[k]); setStatus('saving');
  timers[k]=setTimeout(()=>{
    delete timers[k];
    const data=clone(k==='settings'?settings:(months[k]||{}));
    const local=IDB.set(k,data);   // 계정 DB를 쓸 때도 기기에 백업
    if(mode==='db'){
      chains[k]=(chains[k]||Promise.resolve()).then(()=>db.doc(docPath(k)).set(data))
        .then(()=>{ if(!Object.keys(timers).length) setStatus('ok') })
        .catch(e=>{ setStatus('err'); toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 오래된 달 기록을 정리해 주세요.':'저장하지 못했어요. 잠시 후 다시 입력해 주세요.') });
    }else if(mode==='sb'){
      sbDirty.add(k); saveDirty(); sbFlush();
    }else{
      if(sbPass()){ sbDirty.add(k); saveDirty() }   // 서버에 못 붙은 동안 바뀐 것은 다음 연결 때 올린다
      local.then(ok=>{ if(!ok){setStatus('err');toast('이 기기에 저장하지 못했어요. 브라우저 저장 공간 설정을 확인해 주세요.')} else if(!Object.keys(timers).length) setStatus('ok') });
    }
  },delay);
}
function setStatus(s){
  statusS=s;
  const where = mode==='db' ? '내 계정 DB에 저장 · 나만 볼 수 있음' : mode==='sb' ? '서버(Supabase)에 저장됨' : sbFailed ? '서버 연결 안 됨 · 이 기기에 저장됨' : '이 기기 내부 DB에 저장됨';
  statusT = s==='saving' ? '저장 중…' : s==='err' ? '저장 실패' : where;
  const el=document.getElementById('status'); if(el){el.dataset.s=s;el.querySelector('em').textContent=statusT}
}

let unsubs=[];
function watchMonths(){
  const keys=[mkey(cur), mkey(shift(cur,-1))];
  if(mode==='db'){
    unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
    keys.forEach(k=>{
      unsubs.push(db.doc(docPath(k)).onSnapshot(s=>{
        if(timers[k]) return;
        const d=s.exists?clone(s.data()):null;
        if(k in months && JSON.stringify(months[k])===JSON.stringify(d)) return;
        months[k]=d; render();
      },()=>setStatus('err')));
    });
  }else{
    Promise.all(keys.filter(k=>!(k in months)).map(async k=>{ const v=await IDB.get(k); if(!(k in months)) months[k]=v||null })).then(render);
  }
  render();
}

async function boot(){
  const c=window.claude;
  if(c && typeof c.use==='function'){
    try{
      const [d,u]=await Promise.all([c.use('db'),c.use('user')]);
      const id=u?await u.id():null;
      if(d&&id){db=d;uidv=id;mode='db'}
    }catch(e){}
  }
  if(mode==='db'){
    setStatus('ok');
    let migrated=false;
    db.doc(docPath('settings')).onSnapshot(async s=>{
      if(timers.settings) return;
      // 계정 DB가 비어 있으면 이 기기에 저장돼 있던 데이터를 계정 DB로 옮긴다
      if(!s.exists && !s.metadata.fromCache && !migrated){
        migrated=true;
        const loc=normSettings(await IDB.get('settings'));
        if(loc.fixed.length||loc.accounts.length){
          settings=loc; settingsLoaded=true; persist('settings',0);
          for(const k of (await IDB.keys()).filter(k=>/^m-\d{4}-\d{2}$/.test(k))){
            const v=await IDB.get(k); if(!v) continue;
            months[k]=v; try{await db.doc(docPath(k)).set(v)}catch(e){}
          }
          render(); toast('이 기기에 있던 데이터를 계정 DB에 저장했어요');
          return;
        }
      }
      const d=normSettings(s.exists?clone(s.data()):null);
      if(settingsLoaded && JSON.stringify(d)===JSON.stringify(settings)) return;
      settings=d; settingsLoaded=true; render();
    },()=>{ setStatus('err') });
  }else{
    if(sbPass()) await sbBoot();
    if(mode!=='sb'){ mode='local'; settings=normSettings(await IDB.get('settings')); settingsLoaded=true; setStatus('ok'); }
  }
  watchMonths();
}

/* ---------- calc ---------- */
function calc(){
  const k=mkey(cur), m=view(months[k]);
  const items=settings.fixed.map(f=>({f,amt:amountOf(f,m),day:dayOf(f,cur),paid:!!(m.paid&&m.paid[f.id])}));
  const byCat={}; CATS.forEach(c=>byCat[c.k]={items:[],sum:0});
  items.forEach(it=>{const b=byCat[it.f.cat]||byCat.card; b.items.push(it); b.sum+=it.amt});
  Object.values(byCat).forEach(b=>b.items.sort((a,z)=>a.day-z.day||String(a.f.name).localeCompare(z.f.name)));
  const fixed=items.reduce((a,i)=>a+i.amt,0);
  const paidAmt=items.filter(i=>i.paid).reduce((a,i)=>a+i.amt,0);
  return {k,m,items,byCat,fixed,paidAmt,paidN:items.filter(i=>i.paid).length};
}

/* ---------- render ---------- */
let composing=false, renderLater=false;
app.addEventListener('compositionstart',()=>{composing=true});
app.addEventListener('compositionend',()=>{composing=false; if(renderLater){renderLater=false; setTimeout(render,0)}});
function render(){
  // 한글 조합 중에 입력란을 다시 그리면 글자가 깨지므로 조합이 끝난 뒤 그린다
  if(composing){renderLater=true;return}
  const a=document.activeElement, fid=a&&a.id&&app.contains(a)?a.id:null;
  let ss=null,se=null,val=null; if(fid&&a.tagName==='INPUT'&&a.type==='text'){val=a.value;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  app.classList.toggle('shell',settingsLoaded);
  app.innerHTML = settingsLoaded ? page() : `<div class="loading">가계부를 불러오는 중…</div>`;
  if(fid){const el=document.getElementById(fid); if(el){ if(val!==null) el.value=val; el.focus({preventScroll:true}); if(ss!==null){try{el.setSelectionRange(ss,se)}catch(e){}} }}
  updateKw();
}

/* ---------- 금액 한글 표기 (예: 1,234,000 → 백이십삼만 사천 원) ---------- */
function hangulWon(n){
  n=Math.floor(Number(n)||0); if(!n) return '';
  const D='영일이삼사오육칠팔구', S=['','십','백','천'], G=['','만','억','조','경'];
  const parts=[]; let g=0;
  while(n>0 && g<G.length){
    const v=n%10000; n=Math.floor(n/10000);
    if(v){
      let s=''; const ds=String(v).padStart(4,'0');
      for(let i=0;i<4;i++){const d=+ds[i]; if(!d) continue; const u=S[3-i]; s+=(d===1&&u?'':D[d])+u}
      if(g===1&&v===1) s='';               // 10,000 → 만
      parts.unshift(s+G[g]);
    }
    g++;
  }
  return parts.join(' ')+' 원';
}
const kwEl=document.getElementById('kw');
function updateKw(){
  const a=document.activeElement;
  const box=a&&a.tagName==='INPUT'&&a.closest('.money');
  const txt=box?hangulWon(num(a.value)):'';
  if(!txt){kwEl.hidden=true;return}
  kwEl.textContent=txt; kwEl.hidden=false;
  const r=box.getBoundingClientRect(), w=kwEl.offsetWidth, h=kwEl.offsetHeight;
  let left=Math.min(r.right-w, window.innerWidth-w-16); left=Math.max(16,left);
  let top=r.bottom+6; if(top+h>window.innerHeight-8) top=r.top-h-6;
  kwEl.style.left=left+'px'; kwEl.style.top=top+'px';
}
document.addEventListener('focusin',updateKw);
document.addEventListener('focusout',()=>setTimeout(updateKw,0));
document.addEventListener('input',()=>setTimeout(updateKw,0));
window.addEventListener('scroll',updateKw,{passive:true,capture:true});
window.addEventListener('resize',updateKw);

const STEPS=[{k:'setup',n:'고정비 등록'},{k:'month',n:'이번 달 입력'},{k:'share',n:'요약 공유'}];
let step=(()=>{const h=(location.hash||'').slice(1);if(STEPS.some(s=>s.k===h))return h;try{const v=localStorage.getItem(LS+'step');if(STEPS.some(s=>s.k===v))return v}catch(e){}return 'setup'})();

const svg16=p=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  setup:svg16('<path d="M3 4h10M3 8h10M3 12h6"/>'),
  month:svg16('<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/>'),
  share:svg16('<path d="M8 2v8M5 5l3-3 3 3M3 9v4h10V9"/>'),
  prev:svg16('<path d="M10 3 5 8l5 5"/>'),
  next:svg16('<path d="m6 3 5 5-5 5"/>'),
  chev:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 5.5 3 3 3-3"/></svg>'
};
// 통장 한 쪽: 줄 세 개와 아직 안 나간 칸 하나
const MARK=`<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3.75" y="2.75" width="14.5" height="16.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7.5h8M7 11h8M7 14.5h3.5" stroke="currentColor" stroke-width="1.5"/><rect x="12.5" y="13" width="3" height="3" fill="var(--hue)"/></svg>`;

function page(){
  const C=calc();
  const isNow = cur.y===now.getFullYear() && cur.m===now.getMonth()+1;
  if(!settings.fixed.length && step!=='setup') step='setup';
  const left=C.items.filter(i=>!i.paid).length;
  const nav=STEPS.map(s=>{
    const dis=s.k!=='setup'&&!settings.fixed.length;
    const cnt=s.k==='month'&&C.items.length?`<span class="cnt">${left?`${left}건 남음`:'모두 완료'}</span>`:'';
    return `<button data-act="step" data-step="${s.k}" ${step===s.k?'aria-current="page"':''} ${dis?'disabled':''}>${ICON[s.k]}<span>${s.n}</span>${cnt}</button>`;
  }).join('');
  return `<aside class="side">
    <div class="mark">${MARK}<span>고정비 가계부</span></div>
    <nav class="nav" aria-label="화면">${nav}</nav>
    <div class="side-foot"><span class="status" id="status" data-s="${statusS}"><i></i><em>${esc(statusT)}</em></span></div>
  </aside>
  <main class="canvas">${step==='setup'?setupView(C):step==='month'?monthView(C,isNow):shareView(C,isNow)}</main>`;
}

function monthHead(isNow,suffix,sub,acts){
  return `<header class="head">
    <div class="head-t">
      <div class="monthnav">
        <h1><button class="mlabel" data-act="pick-month" aria-haspopup="dialog" aria-expanded="${picker?'true':'false'}">${cur.y}년 ${cur.m}월 ${suffix}${ICON.chev}</button></h1>
        <button class="iconbtn" data-act="prev" aria-label="이전 달">${ICON.prev}</button>
        <button class="iconbtn" data-act="next" aria-label="다음 달">${ICON.next}</button>
        ${picker?pickerView():''}
      </div>
      ${sub?`<p class="sub">${sub}</p>`:''}
    </div>
    <div class="head-act">${isNow?'':'<button class="btn" data-act="today">이번 달로</button>'}${acts||''}</div>
  </header>`;
}

/* 이 달에서 가장 먼저 봐야 할 한 줄 */
function finding(C,isNow){
  if(!C.items.length) return '';
  const unpaid=C.items.filter(i=>!i.paid).sort((a,b)=>a.day-b.day);
  if(!unpaid.length) return `${cur.m}월 고정비 이체를 모두 마쳤어요.`;
  const sum=l=>won(l.reduce((s,i)=>s+i.amt,0));
  const nowKey=now.getFullYear()*12+now.getMonth()+1, curKey=cur.y*12+cur.m;
  if(!months[C.k]&&curKey!==nowKey) return `이 달은 입력한 기록이 없어요. 등록한 기본 금액으로 보여 드려요.`;
  if(curKey<nowKey) return `<b class="warn">완료 체크하지 않은 이체가 ${unpaid.length}건, ${sum(unpaid)}원 남아 있어요.</b>`;
  const today=now.getDate();
  const late=isNow?unpaid.filter(i=>i.day<today):[];
  const next=unpaid.find(i=>!isNow||i.day>=today);
  const nextTxt=next?`${next.day}일(${WD[wdOf(cur,next.day)]}) ${esc(next.f.name)} ${won(next.amt)}원`:'';
  if(late.length) return `<b class="warn">날짜가 지난 이체 ${late.length}건(${sum(late)}원)이 아직 완료 체크되지 않았어요.</b>${next?` 다음 이체는 ${nextTxt}.`:''}`;
  return `다음 이체는 ${nextTxt}이에요.`;
}

/* ① 고정비 등록: 매달 나가는 날짜와 입금계좌를 미리 등록 */
function setupView(C){
  const hasSample=settings.accounts.some(a=>a.sample)||settings.fixed.some(f=>f.sample);
  const base=settings.fixed.reduce((s,f)=>s+(Number(f.amount)||0),0);
  const n=settings.fixed.length;
  const head=`<header class="head">
    <div class="head-t"><h1>고정비·계좌 등록</h1>
      <p class="sub">${n?`항목 ${n}개 · 계좌 ${settings.accounts.length}개 · 기본 금액 합계 <span class="num">${won(base)}</span>원`:'매달 나가는 돈을 한 번만 등록해 두면, 달마다 금액만 확인하면 돼요.'}</p></div>
    ${n?`<div class="head-act"><button class="btn" data-act="step" data-step="month">${cur.m}월 금액 입력</button><button class="btn primary" data-act="add-item" data-cat="card">고정비 추가</button></div>`:''}
  </header>`;
  if(!n){
    return `${head}
    <section class="card first" aria-labelledby="h-first">
      <h2 id="h-first">카드값, 대출, 보험, 용돈, 저축을 등록하세요</h2>
      <p>나가는 날짜와 입금계좌를 함께 등록해 두면, 매달 이체 일정과 계좌별로 넣어 둘 돈이 정리돼요.</p>
      <div class="acts">
        <button class="btn primary" data-act="add-item" data-cat="card">고정비 추가</button>
        <button class="btn" data-act="add-acc">입금계좌 먼저 등록</button>
        <button class="btn" data-act="sample">예시로 채워 보기</button>
      </div>
    </section>
    ${settings.accounts.length?`<div style="margin-top:32px">${accountSetup()}</div>`:''}`;
  }
  const groups=CATS.map(c=>{
    const list=settings.fixed.filter(f=>f.cat===c.k).sort((a,b)=>((a.day||32)-(b.day||32)));
    return {c,list,sum:list.reduce((s,f)=>s+(Number(f.amount)||0),0)};
  });
  return `${head}
  ${hasSample?`<div class="notice">예시 데이터가 들어 있어요. 항목마다 수정을 눌러 내 정보로 바꾸거나, <button class="link" data-act="clear-sample">예시 모두 지우기</button></div>`:''}
  <section class="sect" aria-labelledby="h-fix">
    <div class="sect-l">
      <h2 id="h-fix">고정비 항목</h2>
      <p>매달 나가는 날짜와 입금계좌, 기본 금액이에요. 카드값처럼 달마다 다른 금액은 비워 두고 그 달 화면에서 입력해도 돼요.</p>
      <dl class="kv">${groups.map(g=>`<div><dt>${g.c.n} ${g.list.length}건</dt><dd class="num">${won(g.sum)}원</dd></div>`).join('')}
        <div class="total"><dt>기본 금액 합계</dt><dd class="num">${won(base)}원</dd></div></dl>
    </div>
    <div class="sect-p">${groups.map(({c,list})=>`<div class="grp">
      <div class="grp-h"><h3>${c.n}</h3><span class="cnt">${list.length}건</span><button class="link" data-act="add-item" data-cat="${c.k}">${c.n} 추가</button></div>
      ${list.length?list.map(f=>{const acc=accLabel(f.accountId);return `<div class="srow">
        <div class="d"><b class="num">${f.day===0?'말일':f.day+'일'}</b><small>매달</small></div>
        <div class="n"><div class="nm">${esc(f.name)}${f.sample?'<span class="tag">예시</span>':''}</div>
          <div class="mt">${acc?esc(acc):'<span class="tag warn">입금계좌 미지정</span>'}</div></div>
        <div class="a num">${f.amount?won(f.amount)+'원':'<span class="dash">달마다 입력</span>'}</div>
        <button class="edit" data-act="edit-item" data-id="${esc(f.id)}" aria-label="${esc(f.name)} 수정">수정</button>
      </div>`}).join(''):`<p class="none">등록된 ${c.n} 항목이 없어요.</p>`}
    </div>`).join('')}</div>
  </section>
  ${accountSetup()}
  <div class="sect-end"><button class="btn" data-act="step" data-step="month">${cur.m}월 금액 입력으로</button></div>`;
}
function accountSetup(){
  return `<section class="sect" aria-labelledby="h-acc">
    <div class="sect-l">
      <h2 id="h-acc">입금계좌</h2>
      <p>카드 결제계좌, 대출 상환계좌처럼 고정비가 빠져나가는 계좌예요. 계좌번호는 이체 목록과 요약 공유에 함께 나와요.</p>

    </div>
    <div class="sect-p">
      ${settings.accounts.map(a=>{const its=settings.fixed.filter(f=>f.accountId===a.id);return `<div class="srow acc">
        <div class="n"><div class="nm">${esc(a.alias||a.bank)}${a.sample?'<span class="tag">예시</span>':''}</div><div class="mt">${esc([a.bank,a.number].filter(Boolean).join(' '))||'—'}</div></div>
        <div class="mt links">${its.length?its.map(f=>esc(f.name)).join(', '):'연결된 항목 없음'}</div>
        <button class="edit" data-act="edit-acc" data-id="${esc(a.id)}" aria-label="${esc(a.alias||a.bank)} 계좌 수정">수정</button>

/* ② 이번 달 입력 */
function monthView(C,isNow){
  return `${monthHead(isNow,'고정비',finding(C,isNow),'<button class="btn primary" data-act="copy-share-now">요약 복사</button>')}
  <div class="grid">
    <div class="col pin">${leadCard(C)}</div>
    <div class="col">${chartCard(C,isNow)}${fixedPanel(C,isNow)}</div>
  </div>`;
}

function leadCard(C){
  const left=C.fixed-C.paidAmt, ln=C.items.filter(i=>!i.paid).length;
  const pct=C.fixed?C.paidAmt/C.fixed*100:0;
  const cats=CATS.map(c=>({c,b:C.byCat[c.k]})).sort((x,y)=>y.b.sum-x.b.sum);
  const maxCat=cats[0]?cats[0].b.sum:0;
  return `<section class="card lead" aria-labelledby="h-left">
    <h2 class="kpi-l" id="h-left">남은 이체</h2>
    <div class="kpi num">${won(left)}<small>원</small></div>
    <p class="kpi-s">${cur.m}월 고정비 <span class="num">${won(C.fixed)}</span>원 · ${C.items.length}건 중 ${ln}건 남음</p>
    <div class="plan" role="img" aria-label="이체 완료 ${won(C.paidAmt)}원, 남은 이체 ${won(left)}원">${pct>0?`<span class="p-done" style="width:${pct}%"></span>`:''}${pct<100&&C.fixed?`<span class="p-left" style="flex:1"></span>`:''}</div>
    <div class="plan-l"><span>완료 <b class="num">${won(C.paidAmt)}원</b> · ${C.paidN}건</span><span>전체 <b class="num">${won(C.fixed)}원</b></span></div>
    ${accountPanel(C)}
    <div class="sec">
      <div class="sec-h"><h3>분류별</h3><span>많은 순</span></div>
      ${cats.map(({c,b},i)=>`<div class="cat-r ${i===0&&b.sum?'top':''}">
        <div class="r1"><span>${c.n}<em>${b.items.length}건</em></span><span class="num ${b.sum?'':'zero'}">${won(b.sum)}원</span></div>
        ${b.sum?`<i class="thin" style="width:${b.sum/maxCat*100}%"></i>`:''}
      </div>`).join('')}
    </div>
  </section>`;
}

/* 이 달의 1일부터 말일까지, 날마다 나가는 돈 */
function chartCard(C,isNow){
  const ld=lastDay(cur), days={};
  C.items.forEach(it=>{(days[it.day]=days[it.day]||[]).push(it)});
  const totals=Object.values(days).map(l=>l.reduce((s,i)=>s+i.amt,0));
  const max=Math.max(0,...totals);
  // 눈금: 만 원 단위로 2~4칸, 맨 위 눈금은 최댓값보다 크게
  const steps=[1e4,2e4,5e4,1e5,2e5,25e4,5e5,1e6,2e6,25e5,5e6,1e7,2e7,5e7,1e8];
  const stepV=steps.find(s=>Math.floor(max/s)+1<=4)||1e8;
  const top=stepV*(Math.floor(max/stepV)+1);
  const ticks=[]; for(let v=0;v<=top;v+=stepV) ticks.push(v);
  const lab=v=>v===0?'0':v>=1e8?`${v/1e8}억`:`${v/1e4}만`;
  const cols=[]; for(let d=1;d<=ld;d++){
    const l=(days[d]||[]).slice().sort((a,b)=>Number(b.paid)-Number(a.paid));
    cols.push(`<div class="dc-col">${l.map(i=>`<span class="${i.paid?'done':''}" style="height:${i.amt/top*100}%" title="${d}일 ${esc(i.f.name)} ${won(i.amt)}원 · ${i.paid?'완료':'남음'}"></span>`).join('')}</div>`);
  }
  const xs=[1,8,15,22,29].filter(d=>d<=ld);
  const today=now.getDate();
  const ln=C.items.filter(i=>!i.paid).length;
  return `<section class="card" aria-labelledby="h-cal">
    <div class="card-h"><h2 id="h-cal">${cur.m}월 이체 달력</h2>
      <span class="meta"><span class="key"><i class="sw"></i>남은 이체</span><span class="key"><i class="sw done"></i>완료</span></span></div>
    <div class="dchart" role="img" aria-label="${cur.m}월 날짜별 이체 금액. ${Object.keys(days).length}일에 걸쳐 ${C.items.length}건, 그중 ${ln}건 남음">
      <div class="dc-y">${ticks.map(v=>`<span style="bottom:${v/top*100}%">${lab(v)}</span>`).join('')}</div>
      <div class="dc-plot">
        ${ticks.slice(1).map(v=>`<i class="dc-grid" style="bottom:${v/top*100}%"></i>`).join('')}
        ${isNow?`<i class="dc-today" style="left:calc(${(today-.5)/ld*100}% - .5px)"><em>오늘 ${today}일</em></i>`:''}
        <div class="dc-cols" style="--days:${ld}">${cols.join('')}</div>
      </div>
      <div class="dc-x">${xs.map(d=>`<span style="left:${(d-.5)/ld*100}%">${d}일</span>`).join('')}</div>
    </div>
  </section>`;
}

/* ③ 요약 공유 */
function shareView(C,isNow){
  const text=shareText(), lines=text.split('\n').length;
  const left=C.fixed-C.paidAmt, ln=C.items.length-C.paidN;
  return `${monthHead(isNow,'요약 공유','카카오톡이나 문자에 붙여넣을 내용이에요. 합계와 분류별 내역, 이체 완료 여부가 담겨요.','<button class="btn primary" data-act="copy-share">텍스트 복사</button>')}
  <div class="grid">
    <div class="col"><section class="card" aria-labelledby="h-sum">
      <div class="card-h"><h2 id="h-sum">담긴 숫자</h2></div>
      <dl class="kv">
        <div class="total"><dt>${cur.m}월 합계 · ${C.items.length}건</dt><dd class="num">${won(C.fixed)}원</dd></div>
        <div><dt>이체 완료 · ${C.paidN}건</dt><dd class="num">${won(C.paidAmt)}원</dd></div>
        <div><dt>남은 이체 · ${ln}건</dt><dd class="num">${won(left)}원</dd></div>
        ${CATS.filter(c=>C.byCat[c.k].items.length).map(c=>`<div><dt>${c.n} · ${C.byCat[c.k].items.length}건</dt><dd class="num">${won(C.byCat[c.k].sum)}원</dd></div>`).join('')}
      </dl>
    </section></div>
    <div class="col"><section class="card" aria-labelledby="h-msg">
      <div class="card-h"><h2 id="h-msg">보낼 내용</h2><span class="meta">${lines}줄</span></div>
      <textarea class="txt sharebox" id="share-text" readonly rows="${lines+1}" aria-label="요약 텍스트">${esc(text)}</textarea>
    </section></div>
  </div>`;
}

function accName(id){const a=settings.accounts.find(x=>x.id===id);return a?(a.alias||a.bank):null}
// 별칭 + 계좌번호 (예: 권준호_하나 123-456-789)
function accLabel(id){const a=settings.accounts.find(x=>x.id===id);if(!a)return null;const nm=a.alias||a.bank;return a.number?nm+" "+a.number:nm}

function fixedPanel(C,isNow){
  const prev=months[mkey(shift(cur,-1))];
  const prevN=prev&&prev.amounts?Object.keys(prev.amounts).filter(id=>settings.fixed.some(f=>f.id===id)).length:0;
  const curN=Object.keys(view(C.m).amounts||{}).length;
  const order=Object.fromEntries(CATS.map((c,i)=>[c.k,i]));
  const rows=C.items.slice().sort((a,b)=>a.day-b.day||(order[a.f.cat]-order[b.f.cat])||String(a.f.name).localeCompare(b.f.name));
  return `<section class="card" aria-labelledby="h-fix">
    <div class="card-h"><h2 id="h-fix">이체 목록</h2>
      <span class="meta">${prevN&&!curN?`<button class="link" data-act="copy-prev-amt">지난달 금액 가져오기 (${prevN}건)</button>`:'입금일 순'}</span></div>
    <div class="t-head" aria-hidden="true"><span>날짜</span><span>항목</span><span class="r">이번 달 금액</span><span class="c">완료</span><span></span></div>
    <div class="rows">${rows.map(it=>itemRow(it,C,isNow)).join('')}</div>
    <div class="t-foot"><span>합계 ${rows.length}건</span><b class="num r">${won(C.fixed)}원</b><span></span></div>
    <div class="t-more"><button class="link" data-act="step" data-step="setup">항목·계좌 추가와 변경</button></div>
  </section>`;
}
function itemRow(it,C,isNow){
  const f=it.f, wd=wdOf(cur,it.day), we=wd===0||wd===6;
  const acc=accLabel(f.accountId);
  const over=typeof (C.m&&C.m.amounts&&C.m.amounts[f.id])==='number';
  const late=isNow&&!it.paid&&it.day<now.getDate();
  const sub=late?'지남':f.day===0?'말일':WD[wd]+'요일';
  return `<div class="row ${it.paid?'paid':''}">
    <div class="d" title="${f.day===0?'매달 말일':'매달 '+f.day+'일'}${we?' · 주말이라 다음 영업일에 처리될 수 있어요':''}"><b class="num">${it.day}</b><small class="${late?'late':''}">${sub}</small></div>
    <div class="n"><div class="nm">${esc(f.name)}${f.sample?'<span class="tag">예시</span>':''}</div>
      <div class="mt">${esc(CATN[f.cat]||'')} · ${acc?esc(acc):'<span class="tag warn">계좌 미지정</span>'}${over?` · 기본 <span class="num">${won(f.amount)}</span>원에서 바꿈`:''}</div></div>
    <div class="money"><input id="amt-${esc(f.id)}" type="text" inputmode="numeric" data-bind="amt" data-id="${esc(f.id)}" value="${won(it.amt)}" aria-label="${esc(f.name)} 이번 달 금액" autocomplete="off"><span>원</span></div>
    <label class="check" title="이체 완료"><input type="checkbox" id="paid-${esc(f.id)}" data-bind="paid" data-id="${esc(f.id)}" ${it.paid?'checked':''} aria-label="${esc(f.name)} 이체 완료"></label>
    <button class="edit" data-act="edit-item" data-id="${esc(f.id)}" aria-label="${esc(f.name)} 설정 수정">수정</button>
  </div>`;
}

/* 계좌마다 이달에 넣어 둘 돈 */
function accountPanel(C){
  const groups=settings.accounts.map(a=>({a,items:C.items.filter(i=>i.f.accountId===a.id)}));
  const orphan=C.items.filter(i=>!settings.accounts.some(a=>a.id===i.f.accountId));
  const row=(title,sub,items,editId)=>{
    const tot=items.reduce((s,i)=>s+i.amt,0), done=items.filter(i=>i.paid).reduce((s,i)=>s+i.amt,0), rem=tot-done;
    const nextUnpaid=items.filter(i=>!i.paid).sort((x,y)=>x.day-y.day)[0];
    return `<div class="acct">
      <div class="r1">${editId?`<button class="nm" data-act="edit-acc" data-id="${esc(editId)}" aria-label="${esc(title)} 계좌 수정">${esc(title)}</button>`:`<span class="nm">${esc(title)}</span>`}<span class="num ${rem?'':'zero'}">${won(rem)}원</span></div>

async function loadMonthIndex(){
  const out={};
  const add=(k,d)=>{
    if(!isMonthKey(k)||!d) return;
    const m=view(d);
    if(!Object.keys(m.amounts||{}).length && !Object.keys(m.paid||{}).length) return;
    out[k]={total:settings.fixed.reduce((s,f)=>s+amountOf(f,m),0), paid:settings.fixed.filter(f=>m.paid&&m.paid[f.id]).length};
  };
  if(mode==='db'){ try{ const q=await db.collection(`data/users/${uidv}`).get(); q.docs.forEach(d=>d.exists&&add(d.id,d.data())) }catch(e){} }
  else { for(const k of (await IDB.keys()).filter(isMonthKey)) add(k, await IDB.get(k)) }

}

const PASS_HASH='c27ca1e58418a8cc8169f2f36c38969cdfcac0d3ab0eab7659ca74c99518fb09';
async function sha256(s){
  const bytes=new TextEncoder().encode(s);
  if(window.crypto&&crypto.subtle){
    try{const buf=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(_){}
  }
  return sha256js(bytes);
}
// crypto.subtle을 못 쓰는 환경(파일로 열기, http)용 SHA-256

  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4,l*8); dv.setUint32(n-8,Math.floor(l/0x20000000));

    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    [a,b,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}
function unlocked(){try{return sessionStorage.getItem(LS+'unlocked')===PASS_HASH && !!sessionStorage.getItem(LS+'pw')}catch(e){return false}}
function showGate(){
  app.innerHTML=`<form class="gate" id="gate" autocomplete="off">
    <div class="mark">${MARK}</div>
    <h1>고정비 가계부</h1>
    <p class="muted">비밀번호를 입력하세요.</p>
    <input class="txt" id="gate-pw" type="password" inputmode="numeric" maxlength="20" aria-label="비밀번호" autocomplete="off">
    <div class="err" id="gate-err" role="alert"></div>
    <button type="submit" class="btn primary">들어가기</button>
  </form>`;
  const f=document.getElementById('gate'), pw=document.getElementById('gate-pw'), err=document.getElementById('gate-err');
  pw.focus();
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const h=await sha256(pw.value);
    if(h===PASS_HASH){ try{sessionStorage.setItem(LS+'unlocked',PASS_HASH);sessionStorage.setItem(LS+'pw',pw.value)}catch(_){}; app.innerHTML='<div class="loading">가계부를 불러오는 중…</div>'; boot(); }
    else { err.textContent='비밀번호가 맞지 않아요.'; pw.value=''; pw.focus(); }
  });
}
if(unlocked()) boot(); else showGate();
})();
</script>
